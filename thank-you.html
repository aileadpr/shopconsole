<style>
  body{margin:0;background:#f6f3fc;color:#1a1625;font-family:Inter,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #e4dcf3;border-radius:20px;padding:32px 24px;max-width:480px;width:100%;text-align:center}
  .ok{width:64px;height:64px;border-radius:50%;background:linear-gradient(90deg,#6a3fd6,#9a6bff);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  h1{font-size:28px;margin:0 0 10px}

  .id{font-weight:700;color:#1a1625}

</head>
<body>
  <div class="card">
    <div class="ok">✓</div>
    <h1>Thank you for your order!</h1>
    <p>Your payment was received. We're preparing your order and you'll receive the tracking number by email as soon as it ships.</p>
    <p id="ord"></p>
    <p>Questions? Just reply to the confirmation email and our team will help you within 24 business hours.</p>
  </div>
<script>
  let o = null;
  try { o = JSON.parse(localStorage.getItem("last_order") || "null"); } catch(_) {}
  if (o) document.getElementById("ord").innerHTML = 'Order reference: <span class="id">' + o.order_id + '</span>';
  try {
    const key = "purchase_tracked_" + (o ? o.order_id : "x");
    if (window.ttq && !localStorage.getItem(key)) {
      window.ttq.track("CompletePayment", { value: o ? o.total : 35.90, currency: "EUR", content_name: o ? o.product : "Dual-Screen Handheld Console" });
      localStorage.setItem(key, "1");
    }
  } catch(_) {}
</script>
</body>
