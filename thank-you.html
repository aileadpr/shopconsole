<script>

  document.documentElement.lang = window.LANG || "en";
  let o = null;
  try { o = JSON.parse(localStorage.getItem("last_order") || "null"); } catch(_) {}
  if (o) document.getElementById("ord").innerHTML = ((window.I18N && window.I18N.ty_ref) || 'Order reference:') + ' <span class="id">' + o.order_id + '</span>';
  try {
    const key = "purchase_tracked_" + (o ? o.order_id : "x");
    if (!localStorage.getItem(key)) {
      if (window.fbq) fbq("track", "Purchase", { value: o ? o.total : 44.90, currency: "USD", content_name: o ? o.product : "Dual-Screen Handheld Console" });
