<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you for your order</title>
<!-- Meta Pixel -->
<script>
window.FB_PIXEL_ID = "1440943994610251";   // <- ID pixel Facebook da inserire
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
if (window.FB_PIXEL_ID) { fbq('init', window.FB_PIXEL_ID); fbq('track', 'PageView'); }
</script>
<style>
  body{margin:0;background:#f6f3fc;color:#1a1625;font-family:Inter,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #e4dcf3;border-radius:20px;padding:32px 24px;max-width:480px;width:100%;text-align:center}
  .ok{width:64px;height:64px;border-radius:50%;background:linear-gradient(90deg,#6a3fd6,#9a6bff);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  h1{font-size:28px;margin:0 0 10px}
  p{color:#6b6480;line-height:1.55;margin:0 0 10px}
  .id{font-weight:700;color:#1a1625}
</style>
</head>
<body>
  <div class="card">
    <div class="ok">✓</div>
    <h1>Thank you for your order!</h1>
    <p>Your payment was received. We're preparing your order and you'll receive the tracking number by email as soon as it ships.</p>
    <p id="ord"></p>
    <p>Questions? Just reply to the confirmation email and our team will help you within 24 business hours.</p>
  </div>
<script>
  let o = null;
  try { o = JSON.parse(localStorage.getItem("last_order") || "null"); } catch(_) {}
  if (o) document.getElementById("ord").innerHTML = 'Order reference: <span class="id">' + o.order_id + '</span>';
  try {
    const key = "purchase_tracked_" + (o ? o.order_id : "x");
    if (window.fbq && window.FB_PIXEL_ID && !localStorage.getItem(key)) {
      fbq("track", "Purchase", { value: o ? o.total : 35.90, currency: "EUR", content_name: o ? o.product : "Dual-Screen Handheld Console" });
      localStorage.setItem(key, "1");
    }
  } catch(_) {}
</script>
</body>
</html>
